  <div class="auth-container">

    <!-- LEFT SIDE -->

    <div class="left-section">

      <div class="logo-area">

        <h1>
           Sahithi Homeopathy Clinic
        </h1>

        <p>
          Smart Healthcare Management
        </p>

      </div>

      <!-- DOCTOR CARD -->

      <div class="doctor-card-animation">

        <div class="medical-circle"></div>

        <div class="doctor-card">

          <div class="doctor-image">

            <img
              src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
              alt="doctor"
            >

          </div>

          <div class="pulse-ring"></div>

        </div>

        <!-- FLOATING PLUS -->

        <div class="floating-plus plus1">+</div>
        <div class="floating-plus plus2">+</div>
        <div class="floating-plus plus3">+</div>

      </div>

      <!-- MEDICAL ICONS -->

      <div class="medical-icons">

        <div class="icon icon1">✚</div>

        <div class="icon icon2">💊</div>

        <div class="icon icon3">🩺</div>

      </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right-section">

      <div class="glass-card">

        <h2>Doctor Login</h2>

        <p class="subtitle">
          Welcome Back 👋
        </p>

        <!-- USERNAME -->
<!-- USERNAME -->

            <div class="input-group">

            <input
                type="text"
                placeholder="Username"
                [(ngModel)]="username"
                #userRef="ngModel"
                required
            >

            </div>

            <div
            class="error-text"
            *ngIf="userRef.invalid && userRef.touched"
            >

            Username is required

            </div>

            <!-- PASSWORD -->

            <div class="input-group password-group">

            <input
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Password"
                [(ngModel)]="password"
                #passRef="ngModel"
                required
            >

            <span
                class="eye-icon"
                (click)="togglePassword()"
            >

                {{ showPassword ? '🙈' : '👁️' }}

            </span>

            </div>

            <div
            class="error-text"
            *ngIf="passRef.invalid && passRef.touched"
            >

            Password is required

            </div>

        <!-- LOGIN BUTTON -->

        <button
        class="login-btn"
        (click)="login()"
        [disabled]="!username || !password"
        >
        Login
        </button>

        <!-- BUTTON GLOW -->

        <div class="login-glow"></div>

        <!-- BOTTOM -->

        <div class="bottom-text">

          Don’t have an account?

          <a routerLink="#">
            Create Account
          </a>

        </div>

      </div>

    </div>

  </div>

  <!-- HOMEOPATHY BOTTLE -->

  <div class="homeo-bottle-area">

    <div class="bottle-glow"></div>

    <div class="homeo-bottle">

      <div class="bottle-cap"></div>

      <div class="bottle-label">

        <span>HOMEO</span>

      </div>

    </div>

    <!-- TABLETS -->

    <div class="tablet tablet1"></div>
    <div class="tablet tablet2"></div>
    <div class="tablet tablet3"></div>
    <div class="tablet tablet4"></div>
    <div class="tablet tablet5"></div>

  </div>

  <!-- CORNER LIGHT -->

  <div class="corner-light"></div>

</div>
